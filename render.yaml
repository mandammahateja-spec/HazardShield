services:
  # Node.js + Express Main Backend
  - type: web
    name: hazardshield-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://hazardshield.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: MONGODB_URI
        sync: false
      - key: RISK_ENGINE_URL
        fromService:
          type: web
          name: hazardshield-risk-engine
          property: host

  # Python FastAPI Risk Engine Microservice
  - type: web
    name: hazardshield-risk-engine
    runtime: python
    rootDir: risk_engine
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
